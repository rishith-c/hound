metadata:
  title: Hound 5 — radars on CP2102 adapters, the USB tree, and the double ground
connectors:
  PI_USB:
    type: Raspberry Pi 4 — USB-A ports
    pinlabels:
    - 'USB 1: webcam'
    - 'USB 2: hub'
    - 'USB 3: free'
    - 'USB 4: free'
    notes: 1.2 A shared across all four ports (peak here 0.80 A). Webcam on its own port, everything else through the hub.
  HUB:
    type: 4-port USB hub (unpowered)
    pinlabels:
    - upstream
    - 'port 1: UNO R4'
    - 'port 2: CP2102 no.1'
    - 'port 3: CP2102 no.2'
    - 'port 4: CP2102 no.3'
  CAM:
    type: Webcam (C920-class) — captive 1.5 m cable
    pinlabels:
    - USB-A
    notes: On the turret beside the thermal array. If it drops out at 1080p, run 720p.
  R4_USB:
    type: UNO R4 WiFi — USB-C
    pinlabels:
    - USB-C
    notes: 'USB CDC serial to the Pi: /dev/serial/by-id/*Arduino*'
  CP1:
    type: CP2102 USB-UART no.1 → LD2410C LEFT
    pinlabels:
    - 3V3
    - 5V
    - GND
    - TXD
    - RXD
    - DTR
    notes: 'Only GND, TXD, RXD are used. 5V and 3V3 pins stay EMPTY (the radar is powered from the LM2596 rail, not the Pi''s USB budget). Jumper on 3.3 V logic if the adapter has one. Label the adapter
      body: LD2410C LEFT.'
  CP2:
    type: CP2102 USB-UART no.2 → LD2410C RIGHT
    pinlabels:
    - 3V3
    - 5V
    - GND
    - TXD
    - RXD
    - DTR
    notes: 'Only GND, TXD, RXD are used. 5V and 3V3 pins stay EMPTY (the radar is powered from the LM2596 rail, not the Pi''s USB budget). Jumper on 3.3 V logic if the adapter has one. Label the adapter
      body: LD2410C RIGHT.'
  CP3:
    type: CP2102 USB-UART no.3 → LD2450 (when the third adapter arrives)
    pinlabels:
    - 3V3
    - 5V
    - GND
    - TXD
    - RXD
    - DTR
    notes: 'Only GND, TXD, RXD are used. 5V and 3V3 pins stay EMPTY (the radar is powered from the LM2596 rail, not the Pi''s USB budget). Jumper on 3.3 V logic if the adapter has one. Label the adapter
      body: LD2450 (when the third adapter arrives).'
  LDL:
    type: HLK-LD2410C LEFT (toed +30° out, deck Y +50)
    pinlabels:
    - 1 TX
    - 2 RX
    - 3 OUT
    - 4 GND
    - 5 VCC
    notes: 'Pins per Hi-Link manual table 1: 1 UART_Tx, 2 UART_Rx, 3 OUT, 4 GND, 5 VCC (5–12 V, 5 V advised). IO 3.3 V, 256000 baud. OUT unused.'
  LDR:
    type: HLK-LD2410C RIGHT (toed −30° out, deck Y −50)
    pinlabels:
    - 1 TX
    - 2 RX
    - 3 OUT
    - 4 GND
    - 5 VCC
    notes: 'Pins per Hi-Link manual table 1: 1 UART_Tx, 2 UART_Rx, 3 OUT, 4 GND, 5 VCC (5–12 V, 5 V advised). IO 3.3 V, 256000 baud. OUT unused.'
  LD2450:
    type: HLK-LD2450 (centre, x/y tracker)
    pinlabels:
    - 5V
    - GND
    - TX
    - RX
    notes: Silkscreen 5V GND TX RX; 5 V supply, 3.3 V UART, 256000 baud. Needs the THIRD CP2102 — until it arrives, leave power and data unplugged.
  WAGO5_P:
    type: Wago 221-415 5-way — 5 V rail +
    pinlabels:
    - LM2596 OUT+
    - LD2410C LEFT VCC
    - LD2410C RIGHT VCC
    - LD2450 5V
    - ESP32-S3 no.3 5V
    notes: Feeds the four sensor loads; the fan takes its own wire straight off the LM2596 OUT terminal.
  WAGO5_N:
    type: Wago 221-415 5-way — 5 V rail −
    pinlabels:
    - LM2596 OUT−
    - LD2410C LEFT GND
    - LD2410C RIGHT GND
    - LD2450 GND
    - ESP32-S3 no.3 GND
    notes: 'Power returns for the sensors. Each radar ALSO grounds to its CP2102 (signal reference): two GND wires per radar.'
cables:
  W_CAM:
    gauge: 28 AWG
    length: 1.5
    colors:
    - WH
    category: bundle
    notes: captive
  W_HUB:
