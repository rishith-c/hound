    length: 0.3
    colors:
    - WH
    category: bundle
  W_R4:
    gauge: 28 AWG
    length: 0.3
    colors:
    - WH
    category: bundle
    notes: USB-A → USB-C
  W_CPA:
    gauge: 28 AWG
    length: 0.15
    colors:
    - WH
    category: bundle
  W_CPB:
    gauge: 28 AWG
    length: 0.15
    colors:
    - WH
    category: bundle
  W_CPC:
    gauge: 28 AWG
    length: 0.15
    colors:
    - WH
    category: bundle
  W_LDL:
    gauge: 26 AWG
    length: 0.25
    colors:
    - GN
    - WH
    - BK
    - RD
    - BK
    category: bundle
    notes: TX, RX, signal-GND to the adapter; VCC and power-GND to the Wagos
  W_LDR:
    gauge: 26 AWG
    length: 0.25
    colors:
    - GN
    - WH
    - BK
    - RD
    - BK
    category: bundle
  W_LD2450:
    gauge: 26 AWG
    length: 0.25
    colors:
    - GN
    - WH
    - BK
    - RD
    - BK
    category: bundle
