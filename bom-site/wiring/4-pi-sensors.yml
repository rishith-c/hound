metadata:
  title: 'Hound 4 — Pi 40-pin header: thermal (i2c3), ToF ×2 (I2C-1), microphone (I2S)'
connectors:
  PI:
    type: Raspberry Pi 4 — 40-pin header (used pins only)
    pinlabels:
    - 1 3V3
    - 3 SDA1 BCM2
    - 5 SCL1 BCM3
    - 6 GND
    - 9 GND
    - 12 BCM18 I2S-BCLK
    - 13 BCM27 XSHUT-rear
    - 14 GND
    - 15 BCM22 XSHUT-front
    - 17 3V3
    - 20 GND
    - 30 GND
    - 35 BCM19 I2S-LRCLK
    - 38 BCM20 I2S-DIN
    - 39 GND
    notes: Physical pin numbers (odd = inner row from the SD-card end). One I2C bus (pins 3/5) for thermal + both ToFs; three boards share it, so chain through their second headers or a mini breadboard
      — one female per Pi pin.
  MLX:
    type: MLX90640 thermal array breakout (0x33)
    pinlabels:
    - VIN 3V3
    - GND
    - SCL
    - SDA
    notes: 'On I2C-1 with the two ToFs (no address clash: 0x33 / 0x29 / 0x30). 400 kHz gives 8 fps; station.py uses 4. Rides beside the webcam on the tilt bracket.'
  TOF_F:
    type: VL53L1X ToF FRONT (0x29 → re-addressed 0x30 by XSHUT)
    pinlabels:
    - VIN 3V3
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: Both ToFs share I2C-1. At boot the Pi holds FRONT XSHUT low, gives REAR 0x29… then raises FRONT and moves it to 0x30.
  TOF_R:
    type: VL53L1X ToF REAR (0x29)
    pinlabels:
    - VIN 3V3
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: XSHUT on BCM 27 so the Pi can reset it independently.
  MIC:
    type: INMP441 I2S microphone
    pinlabels:
    - VDD 3V3
    - GND
    - SCK
    - WS
    - SD
    - L/R
    notes: L/R tied to GND = left channel. On the post front face, 120 mm up (assembly.py).
cables:
  W_MLX:
    gauge: 26 AWG
    length: 0.35
    colors:
    - RD
    - BK
    - YE
    - BU
    category: bundle
    notes: 'to the turret: leave a service loop for tilt'
  W_TOF_F:
    gauge: 26 AWG
    length: 0.25
    colors:
    - RD
    - BK
    - BU
    - YE
    - WH
    category: bundle
  W_TOF_R:
    gauge: 26 AWG
    length: 0.35
    colors:
    - RD
    - BK
    - BU
    - YE
    - WH
    category: bundle
  W_MIC:
    gauge: 26 AWG
    length: 0.25
    colors:
    - RD
    - BK
    - GN
    - OG
    - VT
    - BK
    category: bundle
