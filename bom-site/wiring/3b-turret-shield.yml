metadata:
  title: 'Hound 3B — turret: PCA9685 on the CNC Shield''s I2C pins (ALTERNATIVE — needs a firmware ''t'' command)'
connectors:
  SHIELD_I2C:
    type: CNC Shield v3 — A4/A5 + 5V/GND pins (= R4 Wire bus, 5 V logic)
    pinlabels:
    - A4 SDA
    - A5 SCL
    - 5V
    - GND
    notes: 'A4/A5 are the R4''s primary I2C (''Wire''), 5 V logic, no on-board pull-ups: the PCA9685''s 10 kΩ pull-ups to VCC=5 V do the job. NOT the R4''s Qwiic socket (that is Wire1, 3.3 V).'
  PCA_LOGIC:
    type: PCA9685 logic header (6 pins, either end)
    pinlabels:
    - GND
    - OE
    - SCL
    - SDA
    - VCC
    - V+
    notes: 'Adafruit-pattern silkscreen: GND OE SCL SDA VCC V+. OE left open (internal pull-down = outputs on). V+ pin unused; V+ enters at the terminal. Address 0x40 (no jumpers).'
  PCA_PWR:
    type: PCA9685 servo-power screw terminal
    pinlabels:
    - V+
    - GND
    notes: The big 2-pin terminal at the end of the board = servo rail, NOT logic VCC.
  PCA_CH0:
    type: PCA9685 channel 0 (3-pin, at the board's channel 0 end)
    pinlabels:
    - PWM
    - V+
    - GND
    notes: 'Rows on the board: PWM (top, yellow), V+ (middle, red), GND (bottom, black). Channels 1–15 empty.'
  TILT:
    type: MG996R TILT servo
    pinlabels:
    - signal (orange)
    - V+ (red)
    - GND (brown)
    notes: Plugs straight onto channel 0, brown toward the board edge (GND row). Limits 65–150° in turret.py.
  PAN:
    type: MG996R PAN servo — NOT CONNECTED
    pinlabels:
    - signal
    - V+
    - GND
    notes: 'Continuous-rotation unit: cannot hold an angle. Pinned with the printed lock; leave its lead unplugged.'
  XL4015:
    type: XL4015 5 A buck — trim OUT to 6.0 V
    pinlabels:
    - IN+
    - IN−
    - OUT+
    - OUT−
    notes: Screw terminals. Set 6.00 V on the meter with nothing on OUT, then wire the PCA9685. Heatsink on. 4 A continuous derated.
cables:
  W_I2C:
    gauge: 24 AWG
    length: 0.15
    colors:
    - BK
    - YE
    - BU
    - RD
    category: bundle
    notes: GND, SCL, SDA, 5V — Dupont
  W_SERVO:
    gauge: 22 AWG
    length: 0.12
    colors:
    - RD
    - BK
    category: bundle
  W_TILT:
    gauge: 22 AWG
    length: 0.3
    colors:
    - OG
    - RD
    - BN
    category: bundle
connections:
- - SHIELD_I2C:
    - GND
  - W_I2C:
    - 1
  - PCA_LOGIC:
    - GND
- - SHIELD_I2C:
    - A5 SCL
  - W_I2C:
    - 2
  - PCA_LOGIC:
    - SCL
- - SHIELD_I2C:
    - A4 SDA
  - W_I2C:
    - 3
  - PCA_LOGIC:
    - SDA
- - SHIELD_I2C:
    - 5V
  - W_I2C:
    - 4
  - PCA_LOGIC:
    - VCC
- - XL4015:
    - OUT+
  - W_SERVO:
    - 1
  - PCA_PWR:
    - V+
- - XL4015:
    - OUT−
  - W_SERVO:
    - 2
  - PCA_PWR:
    - GND
- - PCA_CH0:
    - PWM
  - W_TILT:
    - 1
  - TILT:
    - signal (orange)
- - PCA_CH0:
    - V+
  - W_TILT:
    - 2
  - TILT:
    - V+ (red)
- - PCA_CH0:
    - GND
  - W_TILT:
