  - PCA_LOGIC:
    - SCL
- - PI:
    - 3 SDA1 BCM2
  - W_I2C:
    - 3
  - PCA_LOGIC:
    - SDA
- - PI:
    - 1 3V3
  - W_I2C:
    - 4
  - PCA_LOGIC:
    - VCC
- - XL4015:
    - OUT+
  - W_SERVO:
    - 1
  - PCA_PWR:
    - V+
- - XL4015:
    - OUT−
  - W_SERVO:
    - 2
  - PCA_PWR:
    - GND
- - PCA_CH0:
