metadata:
  title: 'Hound 3A — turret: PCA9685 driven by the Pi (AS BUILT — turret.py, station.py)'
connectors:
  PI:
    type: Raspberry Pi 4 — 40-pin header
    pinlabels:
    - 1 3V3
    - 3 SDA1 BCM2
    - 5 SCL1 BCM3
    - 6 GND
    notes: I2C-1 has 1.8 kΩ pull-ups to 3.3 V on the Pi. PCA9685 VCC = 3.3 V so its own pull-ups also sit at 3.3 V — never 5 V here.
  PCA_LOGIC:
    type: PCA9685 logic header (6 pins, either end)
    pinlabels:
    - GND
    - OE
    - SCL
    - SDA
    - VCC
    - V+
    notes: 'Adafruit-pattern silkscreen: GND OE SCL SDA VCC V+. OE left open (internal pull-down = outputs on). V+ pin unused; V+ enters at the terminal. Address 0x40 (no jumpers).'
  PCA_PWR:
    type: PCA9685 servo-power screw terminal
    pinlabels:
    - V+
    - GND
    notes: The big 2-pin terminal at the end of the board = the 5.0 V rail in. Every channel header's middle (V+) and bottom (GND) pin is bussed to it — that is how the fan gets its 5 V.
  PCA_CH0:
    type: PCA9685 channel 0 (3-pin, at the board's channel 0 end)
    pinlabels:
    - PWM
    - V+
    - GND
    notes: 'Rows on the board: PWM (top, yellow), V+ (middle, red), GND (bottom, black).'
  TILT:
    type: MG996R TILT servo
    pinlabels:
    - signal (orange)
    - V+ (red)
    - GND (brown)
    notes: Plugs straight onto channel 0, brown toward the board edge (GND row). Limits 65–150° in turret.py.
  PAN:
    type: MG996R PAN servo — NOT CONNECTED
    pinlabels:
    - signal
    - V+
    - GND
    notes: 'Continuous-rotation unit: cannot hold an angle. Pinned with the printed lock; leave its lead unplugged.'
  XL4015:
    type: HiLetgo XL4015 5 A buck — trim OUT to 5.0 V
    pinlabels:
    - IN+
    - IN−
    - OUT+
    - OUT−
    notes: 'HiLetgo board: four big solder pads, IN+/IN− at the coil end, OUT+/OUT− at the other — tin them and solder the 22 AWG wires (no screw terminals). Set 5.00 V on the meter with nothing on OUT
      (pot turns counter-clockwise to lower). 4 A continuous derated. 5.0 V (not 6) so the fan can share this rail; the MG996R runs 4.8–7.2 V.'
cables:
  W_I2C:
    gauge: 24 AWG
    length: 0.2
    colors:
    - BK
    - YE
    - BU
    - RD
    category: bundle
    notes: GND, SCL (yellow), SDA (blue), 3V3 (red) — Dupont female-female
  W_SERVO:
    gauge: 22 AWG
    length: 0.12
    colors:
    - RD
    - BK
    category: bundle
    notes: 5.0 V from the XL4015; OUT− to the PCA9685 GND TERMINAL is the return
  W_TILT:
    gauge: 22 AWG
    length: 0.3
    colors:
    - OG
    - RD
    - BN
    category: bundle
    notes: the servo's own lead
connections:
- - PI:
    - 6 GND
  - W_I2C:
    - 1
  - PCA_LOGIC:
    - GND
- - PI:
    - 5 SCL1 BCM3
  - W_I2C:
